[package]
name = "rs-pgcopy2rbat"
version = "0.1.0"
edition = "2024"

description = "Convert PostgreSQL binary COPY to Arrow RecordBatch"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-pgcopy2rbat"
homepage = "https://github.com/takanoriyanagitani/rs-pgcopy2rbat"
documentation = "https://docs.rs/rs-pgcopy2rbat/latest"
keywords = ["postgres", "arrow", "pgcopy", "copy", "convert"]

exclude = [
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[dependencies.arrow-array]
version = "60.1.0"
default-features = false
features = [
]

[dependencies.arrow-schema]
version = "60.1.0"
default-features = false
features = [
  "serde",
]
